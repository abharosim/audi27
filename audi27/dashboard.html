<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>audi27</title>
<style>
  :root {
    --bg: #0d1014; --panel: #151a21; --line: #252c36; --text: #e7eaee; --dim: #8892a0;
    --ok: #3fb98c; --warn: #e2aa3f; --bad: #e66a63; --accent: #57a8ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 28px 20px 60px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  h1 { font-size: 20px; font-weight: 650; letter-spacing: .02em; margin: 0; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px;
          border: 1px solid var(--line); color: var(--dim); font-size: 13px; }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  .pill.on { color: var(--ok); border-color: #23513f; }
  .pill.on i { background: var(--ok); box-shadow: 0 0 0 0 rgba(63,185,140,.6); animation: pulse 1.6s infinite; }
  .pill.off { color: var(--bad); border-color: #5a2b29; }
  .pill.off i { background: var(--bad); }
  @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(63,185,140,0); } 100% { box-shadow: 0 0 0 0 rgba(63,185,140,0); } }
  .sub { color: var(--dim); font-size: 13px; margin-left: auto; text-align: right; }
  .wave { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; position: relative; }
  canvas { display: block; width: 100%; height: 110px; }
  .wave .label { position: absolute; left: 16px; top: 10px; font-size: 12px; color: var(--dim); }
  .alert { display: none; margin-top: 12px; padding: 10px 14px; border-radius: 10px; border: 1px solid #5a2b29;
           background: #2a1716; color: #f1a09b; font-size: 13.5px; }
  .tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin: 14px 0 22px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .tile b { display: block; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile span { color: var(--dim); font-size: 12px; }
  .tile.ok b { color: var(--ok); } .tile.warn b { color: var(--warn); } .tile.bad b { color: var(--bad); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  select, input[type=search] { background: var(--panel); color: var(--text); border: 1px solid var(--line);
          border-radius: 8px; padding: 7px 10px; font: inherit; }
  input[type=search] { flex: 1; min-width: 180px; }
  select:focus, input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chip { cursor: pointer; user-select: none; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line);
          background: none; color: var(--dim); font: inherit; font-size: 13px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab { cursor: pointer; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line); background: none;
         color: var(--dim); font: inherit; font-size: 14px; }
  .tab[aria-pressed=true] { color: var(--text); background: #1e2530; border-color: #3a4554; }
  table { width: 100%; border-collapse: collapse; margin: 6px 0 20px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); font-size: 14px; }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  td.num, th.num { text-align: right; }
  .hint { color: var(--dim); font-size: 13.5px; line-height: 1.7; }
  .hint code { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; color: var(--text); }
  main.wide { max-width: 1560px; }
  .fchip { cursor: pointer; user-select: none; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line);
           background: none; color: var(--dim); font: inherit; font-size: 13px; }
  .fchip[aria-pressed=true] { color: var(--text); background: #1e2530; border-color: #3a4554; }
  .chips { display: inline-flex; flex-wrap: wrap; gap: 6px; margin-right: 12px; }
  .runbox { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line);
            border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
  .runbox b { font-weight: 600; font-size: 14px; }
  input[type=text] { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; }
  .btn { cursor: pointer; background: #1f6feb; color: #fff; border: 0; border-radius: 8px; padding: 7px 16px; font: inherit; font-weight: 550; }
  .btn:disabled { background: #2a313c; color: var(--dim); cursor: default; }
  .btn.small { padding: 3px 10px; font-size: 12.5px; font-weight: 500; background: #262d37; color: var(--text); }
  .btn.small.on { background: #5a2b29; color: #f3b1ad; }
  .btn.small.ghost { background: none; color: var(--dim); border: 1px solid var(--line); }
  .keys { margin: -4px 0 10px; }
  .gridwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  #grid { display: grid; min-width: 100%; }
  .gh, .gc { padding: 10px 12px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
  .gh { background: #11161c; color: var(--dim); font-size: 12.5px; font-weight: 550; }
  .gc { line-height: 1.6; overflow-wrap: anywhere; position: relative; }
  .first { position: sticky; left: 0; z-index: 1; background: var(--panel); }
  .gh.first { background: #11161c; }
  .gc.first.sel { box-shadow: inset 3px 0 0 var(--accent); }
  .when { font-variant-numeric: tabular-nums; font-size: 13px; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
  .pick { cursor: pointer; }
  .pick:hover { background: #1a212b; }
  .gc.right { background: #10261e; box-shadow: inset 0 0 0 1px #23513f; }
  .gc.wrong { color: #a8afba; }
  .gc.missing { color: var(--dim); font-size: 12.5px; font-style: italic; }
  .gc .none { color: var(--dim); font-style: italic; }
  .gc .tag { margin-left: 8px; }
  .verdict { display: block; margin-top: 4px; font-size: 12px; color: var(--dim); }
  .gc.right .verdict { color: var(--ok); }
  mark { background: #4d3a12; color: #ffdf9a; border-radius: 3px; padding: 0 1px; }
  .span { grid-column: 1 / -1; }
  .chip[aria-pressed=true] { color: var(--text); background: #1e2530; border-color: #3a4554; }
  .count { color: var(--dim); font-size: 13px; }
  .row { display: grid; grid-template-columns: 92px 1fr auto; gap: 12px; padding: 9px 4px; border-bottom: 1px solid var(--line); }
  .row time { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 13px; padding-top: 2px; }
  .row .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .row.suspect .text { color: #ecd9ad; }
  .row.rejected .text { color: var(--dim); text-decoration: line-through; text-decoration-color: #5b4442; }
  .meta { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .tag { display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 999px; margin-right: 6px; border: 1px solid; }
  .tag.suspect { color: var(--warn); border-color: #5c4a22; } .tag.rejected { color: var(--bad); border-color: #5a2b29; }
  .play { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 8px; cursor: pointer;
          width: 32px; height: 28px; font-size: 12px; }
  .play:hover { color: var(--text); border-color: #3a4554; }
  .empty { color: var(--dim); padding: 40px 0; text-align: center; }
  .routes td { vertical-align: top; }
  .routes .turn { overflow-wrap: anywhere; }
  .mark { cursor: pointer; border: 1px solid var(--line); background: none; color: var(--dim);
          border-radius: 8px; width: 28px; height: 26px; font: inherit; font-size: 14px; margin-right: 4px; }
  .mark.on.yes { color: var(--ok); border-color: #23513f; background: #10261e; }
  .mark.on.no { color: var(--bad); border-color: #5a2b29; background: #2a1716; }
  .need { color: var(--warn); font-size: 12px; }
  @media (max-width: 720px) { .tiles { grid-template-columns: repeat(3, 1fr); } .row { grid-template-columns: 70px 1fr auto; } }
  @media (prefers-reduced-motion: reduce) { .pill.on i { animation: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>audi27</h1>
    <span id="pill" class="pill"><i></i><span id="pillText">连接中</span></span>
    <div class="sub" id="sub"></div>
  </header>

  <div class="wave">
    <span class="label" id="waveLabel"></span>
    <canvas id="wave" aria-label="实时音量波形"></canvas>
  </div>
  <div class="alert" id="alert"></div>

  <div class="tiles">
    <div class="tile ok"><b id="tOk">0</b><span>通过</span></div>
    <div class="tile warn"><b id="tSus">0</b><span>存疑</span></div>
    <div class="tile bad"><b id="tRej">0</b><span>已拒绝</span></div>
    <div class="tile"><b id="tSpool">0</b><span>待转写</span></div>
    <div class="tile"><b id="tFail">0</b><span>转写失败</span></div>
    <div class="tile"><b id="tUp">-</b><span>已运行</span></div>
  </div>

  <div class="tabs">
    <button class="tab" id="tabT" aria-pressed="true">转写记录</button>
    <button class="tab" id="tabE" aria-pressed="false">模型对比</button>
    <button class="tab" id="tabR" aria-pressed="false">路由</button>
  </div>

  <section id="viewR" hidden>
    <p class="hint">路由只显示。点 ✓ / ✗ 标记这条路由对不对，用来看误分派。下面是分派之后的 task / reply / brief / spoken，有进程在写才会出现。</p>
    <div class="bar"><span class="count" id="routeInfo"></span></div>
    <div id="routeList"></div>
    <h2 class="count">回路</h2>
    <div id="loopList"></div>
  </section>

  <section id="viewE" hidden>
    <div class="runbox">
      <b>用另一个模型重跑录音</b>
      <select id="runBackend" aria-label="后端"></select>
      <input id="runLabel" type="text" placeholder="标签" aria-label="标签" size="14">
      <button class="btn" id="runBtn">运行</button>
      <span class="count" id="runInfo"></span>
    </div>
    <div id="evalSummary"></div>
    <div class="bar">
      <span class="count">显示的列</span><span id="colChips" class="chips"></span>
      <label class="count" for="base">对比基准</label><select id="base" aria-label="对比基准"></select>
    </div>
    <div class="bar">
      <button class="fchip" id="fDiff" aria-pressed="true">只看有分歧的</button>
      <button class="fchip" id="fTodo" aria-pressed="false">只看未判定的</button>
      <span class="count" id="evalInfo"></span>
    </div>
    <div class="count keys">点击哪一格，就是判定哪一格正确（可多选）。快捷键：↑↓ 换行 · 1–9 判第几列正确并跳到下一行 · 0 都不对 · 空格 播放</div>
    <div class="gridwrap"><div id="grid"></div></div>
  </section>

  <section id="viewT">
  <div class="bar">
    <select id="day" aria-label="日期"></select>
    <input id="q" type="search" placeholder="搜索转写内容，多个词用空格分隔" aria-label="搜索">
    <button class="chip" data-s="ok" aria-pressed="true">通过</button>
    <button class="chip" data-s="suspect" aria-pressed="true">存疑</button>
    <button class="chip" data-s="rejected" aria-pressed="false">已拒绝</button>
    <span class="count" id="count"></span>
  </div>
  <div id="list"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const today = () => new Date().toLocaleDateString('sv-SE');   // YYYY-MM-DD in local time
const REASONS = {
  low_confidence: '置信度低', high_no_speech_prob: '可能不是人声', language_uncertain: '语言不确定',
  too_much_text_for_duration: '字数超出时长', duplicate_of_previous: '与上一句重复', empty: '无文本',
  repetition_loop: '复读循环', filler_only: '只有语气词', corrected: '已按上下文纠错', no_words: '只有标点', invalid_confidence_metrics: '置信度数值无效', prompt_echo: '提示词回显', no_confidence_metrics: '后端无置信度',
  'piece_dropped:no_speech': '丢弃了静音片段', 'piece_dropped:high_compression_ratio': '丢弃了重复片段',
};
const reasonText = r => r.startsWith('known_hallucination') ? '已知幻觉句' : r.startsWith('correction_rejected') ? '纠错被拒'
  : r.startsWith('language_forced') ? '语言检测被纠正 ' + r.split(':')[1] : (REASONS[r] || r);

/* ---------- waveform ---------- */
const N = 56, cur = new Array(N).fill(0);
let target = new Array(N).fill(0), running = false, speaking = false;
const canvas = $('wave'), ctx = canvas.getContext('2d');
function draw() {
  const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const step = w / N, bw = Math.max(2, step * 0.55), mid = h / 2;
  ctx.fillStyle = !running ? '#3a4350' : speaking ? '#3fb98c' : '#57a8ff';
  for (let i = 0; i < N; i++) {
    cur[i] += (target[i] - cur[i]) * 0.22;
    const bh = Math.max(2, cur[i] * (h - 24)), x = i * step + (step - bw) / 2;
    ctx.globalAlpha = running ? 0.45 + 0.55 * (i / N) : 1;   // older samples fade to the left
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, mid - bh / 2, bw, bh, bw / 2); else ctx.rect(x, mid - bh / 2, bw, bh);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ---------- status ---------- */
function fmtDur(s) {
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}h ${m}m` : m ? `${m}m` : `${s}s`;
}
async function pollStatus() {
  let d = null;
  try { d = await (await fetch('/api/status')).json(); } catch (e) {}
  const st = d && d.status;
  running = !!(d && d.running);
  speaking = running && !!st.speaking;
  const levels = running ? st.levels || [] : [];
  target = Array.from({length: N}, (_, i) => levels[levels.length - N + i] || 0);
  $('pill').className = 'pill ' + (running ? 'on' : 'off');
  $('pillText').textContent = !d ? '仪表盘服务无响应' : running ? '录音中' : '未运行';
  $('waveLabel').textContent = !running ? '' : speaking ? '检测到语音' : '监听中';
  $('tSpool').textContent = d ? d.spool : '-';
  $('tFail').textContent = d ? d.failed : '-';
  $('tUp').textContent = running ? fmtDur(Date.now() / 1000 - st.started) : '-';
  let sub = '';
  if (running) sub = `${(st.backends || []).join(' → ')} · 设备 ${st.device || '默认'}`;
  else if (st && d.age != null) sub = `最后心跳 ${fmtDur(d.age)} 前`;
  else if (d) sub = '还没有心跳记录，运行 audi27 run 开始录音';
  $('sub').textContent = sub;
  const alerts = [];
  if (running && st.mic_silent) alerts.push('麦克风只返回静音：检查 系统设置 → 隐私与安全性 → 麦克风，以及输入设备。');
  if (running && st.dropped_frames) alerts.push(`已丢失 ${st.dropped_frames} 帧音频。`);
  if (d && d.spool > 20) alerts.push(`转写积压 ${d.spool} 段，模型跟不上录音速度。`);
  $('alert').style.display = alerts.length ? 'block' : 'none';
  $('alert').textContent = alerts.join(' ');
}
setInterval(pollStatus, 400); pollStatus();

/* ---------- records ---------- */
let records = [], sig = '', audio = null;
const shown = () => new Set([...document.querySelectorAll('.chip[data-s][aria-pressed=true]')].map(c => c.dataset.s));

function render() {
  const s = shown(), list = $('list'), allDays = $('day').value === '';
  const c = {ok: 0, suspect: 0, rejected: 0};
  records.forEach(r => c[r.status]++);
  $('tOk').textContent = c.ok; $('tSus').textContent = c.suspect; $('tRej').textContent = c.rejected;
  const rows = records.filter(r => s.has(r.status)).reverse();   // newest first
  $('count').textContent = `${rows.length} 条`;
  list.replaceChildren();
  if (!rows.length) {
    const e = document.createElement('div'); e.className = 'empty';
    e.textContent = records.length ? '当前筛选下没有内容' : '这一天还没有转写记录';
    return list.append(e);
  }
  for (const r of rows) {
    const row = document.createElement('div'); row.className = 'row ' + r.status;
    const t = document.createElement('time');
    t.textContent = (allDays ? r.start.slice(5, 10) + ' ' : '') + r.start.slice(11, 19);
    const body = document.createElement('div');
    const text = document.createElement('div'); text.className = 'text';
    text.textContent = r.text || r.raw_text || '（无文本）';
    body.append(text);
    if (r.asr_text) {
      const fix = document.createElement('div'); fix.className = 'meta';
      fix.textContent = '已纠错 · 识别原文：' + r.asr_text;
      body.append(fix);
    }
    if (r.status !== 'ok') {
      const meta = document.createElement('div'); meta.className = 'meta';
      const tag = document.createElement('span'); tag.className = 'tag ' + r.status;
      tag.textContent = r.status === 'suspect' ? '存疑' : '已拒绝';
      meta.append(tag, [...new Set(r.reasons.map(reasonText))].join('、') + ` · ${r.duration}s`);
      body.append(meta);
    }
    row.append(t, body);
    if (r.audio) {
      const b = document.createElement('button'); b.className = 'play'; b.textContent = '▶';
      b.title = '播放这段录音'; b.setAttribute('aria-label', '播放这段录音');
      b.onclick = () => {
        if (audio) audio.pause();
        audio = new Audio('/' + r.audio.split('/').map(encodeURIComponent).join('/'));
        audio.play();
      };
      row.append(b);
    } else row.append(document.createElement('span'));
    list.append(row);
  }
}
async function loadRecords(force) {
  const p = new URLSearchParams();
  if ($('day').value) p.set('date', $('day').value);
  if ($('q').value.trim()) p.set('q', $('q').value.trim());
  let d;
  try { d = await (await fetch('/api/records?' + p)).json(); } catch (e) { return; }
  const recs = d.records || [];
  const next = p + '|' + recs.length + '|' + (recs.length ? recs[recs.length - 1].id : '');
  if (!force && next === sig) return;          // unchanged: keep the DOM (and any playing audio) intact
  sig = next; records = recs; render();
}
async function loadDays() {
  let days = [];
  try { days = (await (await fetch('/api/days')).json()).days; } catch (e) {}
  const sel = $('day'), keep = sel.value || today(), t = today();
  if (!days.includes(t)) days.unshift(t);
  sel.replaceChildren(...days.map(d => new Option(d === t ? `今天 ${d}` : d, d)), new Option('全部日期', ''));
  sel.value = sel.dataset.touched ? keep : t;
}
$('day').onchange = () => { $('day').dataset.touched = '1'; loadRecords(true); };
let timer; $('q').oninput = () => { clearTimeout(timer); timer = setTimeout(() => loadRecords(true), 200); };
document.querySelectorAll('.chip[data-s]').forEach(c => c.onclick = () => {
  c.setAttribute('aria-pressed', c.getAttribute('aria-pressed') !== 'true'); render();
});
/* ---------- model comparison ---------- */
const pct = x => x == null ? '-' : (x * 100).toFixed(1) + '%';
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const TOKEN = /[㐀-鿿豈-﫿]|[a-z0-9]+(?:'[a-z]+)?/g;
// Same normalisation as audi27/textnorm.py cmp_tokens: fillers and 儿 dropped, 的/地/得 merged, immediate repeats collapsed.
const FILLERS = new Set('嗯 呃 唔 啊 哦 噢 哎 um umm uh uhh uhm er erm hmm hm mm mmm mhm huh'.split(' '));
const normTok = t => FILLERS.has(t) || t === '儿' ? null : (t === '地' || t === '得') ? '的' : t;
function toks(text) {
  const out = [];
  for (const raw of (text || '').normalize('NFKC').toLowerCase().match(TOKEN) || []) {
    const t = normTok(raw);
    if (t !== null && out[out.length - 1] !== t) out.push(t);
  }
  return out;
}
const sameToks = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);
async function getJSON(url) { const r = await fetch(url); return r.json(); }
async function postJSON(url, body) {
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  return r.json();
}
function play(path) {
  if (audio) audio.pause();
  audio = new Audio('/' + path.split('/').map(encodeURIComponent).join('/'));
  audio.play();
}

let M = null, hidden = new Set(JSON.parse(sessionStorage.getItem('hiddenCols') || '[]')), curRow = 0, shownRows = [];
const visibleLabels = () => M.labels.map(l => l.label).filter(l => !hidden.has(l));

// Wrap the tokens of `text` that are not part of the longest common subsequence with the base in <mark>.
function diffNode(text, baseText) {
  const shown = (text || '').normalize('NFKC'), lower = shown.toLowerCase(), node = el('span');
  if (baseText == null || lower.length !== shown.length) { node.textContent = shown; return node; }
  const A = [...lower.matchAll(TOKEN)].filter(x => normTok(x[0]) !== null), B = toks(baseText), n = A.length, m = B.length;
  const eq = (i, j) => normTok(A[i][0]) === B[j];
  const L = Array.from({length: n + 1}, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i][j] = eq(i, j) ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let pos = 0, i = 0, j = 0;
  while (i < n) {
    if (j < m && eq(i, j)) { i++; j++; continue; }
    if (i > 0 && normTok(A[i][0]) === normTok(A[i - 1][0])) { i++; continue; }   // a stutter of the previous token
    if (j < m && L[i][j + 1] >= L[i + 1][j]) { j++; continue; }
    node.append(shown.slice(pos, A[i].index), el('mark', '', shown.slice(A[i].index, A[i].index + A[i][0].length)));
    pos = A[i].index + A[i][0].length; i++;
  }
  node.append(shown.slice(pos));
  return node;
}

function renderSummary() {
  const table = el('table'), head = el('tr');
  [['标签', ''], ['模型', ''], ['段数', 'num'], ['人工判对', 'num'], ['与基准完全一致', 'num'], ['与基准的差异率', 'num']]
    .forEach(([t, c]) => head.append(el('th', c, t)));
  table.append(head);
  for (const s of M.labels) {
    const tr = el('tr'), isBase = s.label === M.base;
    tr.append(el('td', '', s.label + (isBase ? '（基准）' : '')), el('td', '', s.model || '-'), el('td', 'num', s.segments),
      el('td', 'num', s.judged ? `${s.correct}/${s.judged} · ${pct(s.correct_rate)}` : '还没判'),
      el('td', 'num', isBase || !s.compared ? '-' : pct(s.same_rate)), el('td', 'num', isBase || !s.compared ? '-' : pct(s.error_rate)));
    table.append(tr);
  }
  $('evalSummary').replaceChildren(table);
}

function renderGrid() {
  const cols = visibleLabels(), grid = $('grid');
  grid.style.gridTemplateColumns = `168px repeat(${Math.max(1, cols.length)}, minmax(300px, 1fr))`;
  grid.replaceChildren();
  let agree = 0, single = 0, judged = 0;
  shownRows = [];
  for (const r of M.rows) {
    const present = cols.filter(l => r.cells[l]);
    const t = present.map(l => toks(r.cells[l].text));
    const same = present.length > 1 && t.every(x => sameToks(x, t[0]));
    if (r.judged) judged++;
    if (present.length < 2) single++; else if (same) agree++;
    if ($('fDiff').getAttribute('aria-pressed') === 'true' && (same || present.length < 2)) continue;
    if ($('fTodo').getAttribute('aria-pressed') === 'true' && r.judged) continue;
    shownRows.push(r);
  }
  $('evalInfo').textContent = `共 ${M.rows.length} 段 · 各列一致 ${agree} · 只有一列 ${single} · 有分歧 ${M.rows.length - agree - single} · 已判定 ${judged} · 当前显示 ${shownRows.length}`;
  grid.append(el('div', 'gh first', '录音'));
  cols.forEach((l, i) => grid.append(el('div', 'gh', `${i + 1} · ${l}${l === M.base ? '（基准）' : ''}`)));
  if (!shownRows.length) { grid.append(el('div', 'empty span', M.rows.length ? '当前筛选下没有需要看的片段' : '还没有录音')); return; }
  curRow = Math.min(curRow, shownRows.length - 1);
  shownRows.slice(0, 400).forEach((r, idx) => {
    const first = el('div', 'gc first' + (idx === curRow ? ' sel' : ''));
    first.dataset.row = idx;
    first.append(el('div', 'when', `${r.start.slice(5, 10)} ${r.start.slice(11, 19)}`), el('div', 'meta', `${r.duration ?? '?'} 秒`));
    const tools = el('div', 'tools');
    if (r.audio) { const b = el('button', 'play', '▶'); b.title = '播放这段录音'; b.setAttribute('aria-label', '播放这段录音'); b.onclick = () => play(r.audio); tools.append(b); }
    else tools.append(el('span', 'meta', '无录音'));
    const none = el('button', 'btn small' + (r.judged && !Object.values(r.cells).some(c => c.correct) ? ' on' : ''), '都不对');
    none.onclick = () => judge(r, []);
    tools.append(none);
    if (r.judged) { const c = el('button', 'btn small ghost', '清除'); c.onclick = () => judge(r, null); tools.append(c); }
    first.append(tools);
    grid.append(first);
    for (const l of cols) {
      const c = r.cells[l];
      if (!c) { grid.append(el('div', 'gc missing', '这个标签没有跑过这一段')); continue; }
      const cell = el('div', 'gc pick' + (r.judged ? (c.correct ? ' right' : ' wrong') : ''));
      cell.title = '点击：判定这一格正确';
      cell.onclick = () => toggle(r, l);
      const baseCell = l !== M.base ? r.cells[M.base] : null;
      if (c.text) cell.append(diffNode(c.text, baseCell ? baseCell.text : null));
      else cell.append(el('span', 'none', c.status === 'rejected' && c.raw ? `（已拒绝）${c.raw}` : '（空）'));
      if (c.status === 'suspect') cell.append(el('span', 'tag suspect', '存疑'));
      if (r.judged) cell.append(el('span', 'verdict', c.correct ? '✓ 正确' : '✗'));
      grid.append(cell);
    }
  });
  if (shownRows.length > 400) grid.append(el('div', 'empty span', `只显示了前 400 段，共 ${shownRows.length} 段`));
}

async function judge(r, labels) {          // labels: [] = none is right, null = clear the verdict
  const body = labels === null ? {id: r.id, cleared: true}
    : {id: r.id, labels, texts: labels.map(l => r.cells[l].text)};
  const res = await postJSON('/api/eval/verdict', body);
  if (res.error) { $('evalInfo').textContent = '保存失败：' + res.error; return; }
  await loadMatrix();
}
function toggle(r, label) {                // click = add/remove this column from the set judged correct
  const set = new Set(Object.keys(r.cells).filter(l => r.judged && r.cells[l].correct));
  const t = toks(r.cells[label].text);
  const sameText = Object.keys(r.cells).filter(l => sameToks(toks(r.cells[l].text), t));
  if (set.has(label)) sameText.forEach(l => set.delete(l)); else set.add(label);
  return judge(r, set.size ? [...set] : (r.judged ? null : [label]));
}
async function loadMatrix() {
  const base = $('base').value || sessionStorage.getItem('base') || '';
  let d;
  try { d = await getJSON('/api/eval/matrix' + (base ? '?base=' + encodeURIComponent(base) : '')); } catch (e) { return; }
  if (d.error) { $('evalInfo').textContent = d.error; return; }
  M = d;
  const names = M.labels.map(l => l.label);
  $('base').replaceChildren(...names.map(l => new Option(l === 'live' ? 'live（录音时的输出）' : l, l)));
  $('base').value = M.base;
  $('colChips').replaceChildren(...names.map(l => {
    const c = el('button', 'fchip', l); c.setAttribute('aria-pressed', !hidden.has(l));
    c.onclick = () => { hidden.has(l) ? hidden.delete(l) : hidden.add(l); sessionStorage.setItem('hiddenCols', JSON.stringify([...hidden])); loadMatrix(); };
    return c;
  }));
  renderSummary(); renderGrid();
}

/* run another model over the stored audio */
let backends = [], armed = false, jobTimer = null;
async function loadBackends() {
  try { backends = (await getJSON('/api/eval/backends')).backends || []; } catch (e) { backends = []; }
  const sel = $('runBackend'), keep = sel.value;
  sel.replaceChildren(...backends.map(b => new Option(b.type === 'correct' ? `只重跑上下文纠错 · ${b.model}（不需要录音）`
    : `${b.name}${b.model ? ' · ' + b.model : ''}${b.cloud ? '（云端）' : ''}`, b.name)));
  if (backends.some(b => b.name === keep)) sel.value = keep;
  else if (backends.some(b => b.name === 'gold')) sel.value = 'gold';
  if (!$('runLabel').value) $('runLabel').value = sel.value === '@correct' ? 'corrected' : sel.value;
  plan();
}
async function plan() {
  armed = false; $('runBtn').textContent = '运行';
  const label = $('runLabel').value.trim(), b = backends.find(x => x.name === $('runBackend').value);
  if (!label || !b) { $('runInfo').textContent = ''; return; }
  let p;
  try { p = await getJSON('/api/eval/plan?label=' + encodeURIComponent(label) + '&backend=' + encodeURIComponent(b.name)); } catch (e) { return; }
  if (p.error) { $('runInfo').textContent = p.error; $('runBtn').disabled = true; return; }
  $('runBtn').disabled = !p.todo;
  $('runInfo').textContent = p.todo
    ? (b.type === 'correct' ? `将对 ${p.todo} 段已有的转写文字重新纠错` : `将处理 ${p.todo} 段、${(p.todo_seconds / 60).toFixed(1)} 分钟录音`) + (b.cloud ? '，录音会上传到云端' : '') +
      (p.already_done ? `；已跑过 ${p.already_done} 段` : '') + (p.no_audio ? `；${p.no_audio} 段没有保留录音` : '')
    : `这个标签已经跑完全部 ${p.already_done} 段有录音的片段` + (p.no_audio ? `（另有 ${p.no_audio} 段没有保留录音）` : '');
}
async function pollJob() {
  let j;
  try { j = await getJSON('/api/eval/job'); } catch (e) { return; }
  if (j.running) {
    $('runBtn').disabled = true;
    $('runInfo').textContent = `正在运行 ${j.label}：${j.ran || 0}${j.todo ? ' / ' + j.todo : ''} 段` + (j.failed ? `，失败 ${j.failed}` : '');
    if (!jobTimer) jobTimer = setInterval(pollJob, 1000);
  } else if (jobTimer) {
    clearInterval(jobTimer); jobTimer = null;
    await loadMatrix(); await plan();
    $('runInfo').textContent = (j.error ? `运行失败：${j.error}` : `完成：${j.ran || 0} 段` + (j.failed ? `，失败 ${j.failed} 段（${j.last_error || ''}）` : '')) + '。' + $('runInfo').textContent;
  }
}
$('runBackend').onchange = () => { $('runLabel').value = $('runBackend').value === '@correct' ? 'corrected' : $('runBackend').value; plan(); };
$('runLabel').oninput = plan;
$('runBtn').onclick = async () => {
  if (!armed) { armed = true; $('runBtn').textContent = '确认运行'; return; }
  armed = false; $('runBtn').textContent = '运行';
  const res = await postJSON('/api/eval/run', {backend: $('runBackend').value, label: $('runLabel').value.trim()});
  if (res.error) { $('runInfo').textContent = res.error; return; }
  jobTimer = setInterval(pollJob, 1000); pollJob();
};
$('base').onchange = () => { sessionStorage.setItem('base', $('base').value); loadMatrix(); };
['fDiff', 'fTodo'].forEach(id => $(id).onclick = () => { $(id).setAttribute('aria-pressed', $(id).getAttribute('aria-pressed') !== 'true'); renderGrid(); });

function setCur(i) {
  curRow = Math.max(0, Math.min(shownRows.length - 1, i));
  document.querySelectorAll('#grid .first.sel').forEach(e => e.classList.remove('sel'));
  const e = document.querySelector(`#grid .first[data-row="${curRow}"]`);
  if (e) { e.classList.add('sel'); e.scrollIntoView({block: 'nearest'}); }
}
document.addEventListener('keydown', async ev => {
  if ($('viewE').hidden || !M || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (['INPUT', 'SELECT', 'TEXTAREA', 'BUTTON'].includes(document.activeElement.tagName)) return;
  const r = shownRows[curRow];
  if (ev.key === 'ArrowDown' || ev.key === 'j') { ev.preventDefault(); setCur(curRow + 1); }
  else if (ev.key === 'ArrowUp' || ev.key === 'k') { ev.preventDefault(); setCur(curRow - 1); }
  else if (ev.key === ' ' && r) { ev.preventDefault(); if (r.audio) play(r.audio); }
  else if (/^[0-9]$/.test(ev.key) && r) {
    ev.preventDefault();
    const label = visibleLabels()[Number(ev.key) - 1];
    if (ev.key !== '0' && (!label || !r.cells[label])) return;
    const stay = $('fTodo').getAttribute('aria-pressed') === 'true';   // the judged row drops out of the list
    await judge(r, ev.key === '0' ? [] : [label]);
    setCur(stay ? curRow : curRow + 1);
  }
});

const TARGETS = {grok: 'Grok', muse: 'Muse', claude_code: 'Claude Code', local: '本地模型', none: '不分派', queue: '队列'};
const COMMANDS = {details: '详细说说', skip: '跳过', later: '稍后', pending: '还有什么', close: '关闭'};
let routeSig = '';
function routeWhen(ts) {
  if (!ts || ts.length < 19) return ts || '';
  return ts.slice(5, 10) + ' ' + ts.slice(11, 19);
}
async function markRoute(row, correct) {
  const body = row.verdict === correct ? {id: row.id, cleared: true} : {id: row.id, correct};
  const res = await postJSON('/api/routes/verdict', body);
  if (res.error) { $('routeInfo').textContent = '保存失败：' + res.error; return; }
  await loadRoutes(true);
}
async function loadRoutes(force) {
  if ($('viewR').hidden) return;
  let d;
  try { d = await getJSON('/api/routes'); } catch (e) { return; }
  if (d.error) { $('routeInfo').textContent = d.error; return; }
  const acc = d.accuracy || {}, rows = d.routes || [];
  const accText = acc.judged ? `准确率 ${(acc.rate * 100).toFixed(1)}%（${acc.correct}/${acc.judged}）` : '还没有判定';
  const sig = accText + '|' + rows.map(r => r.id + ':' + r.verdict + ':' + r.target).join(',');
  $('routeInfo').textContent = `${rows.length} 条 · ${accText}`;
  if (!force && sig === routeSig) { loadLoop(); return; }
  routeSig = sig;
  const list = $('routeList');
  list.replaceChildren();
  loadLoop();
  if (!rows.length) {
    list.append(el('div', 'empty', '还没有路由。对达达说一句，turns 和 route 写进事件流后会出现在这里。'));
    return;
  }
  const table = el('table', 'routes'), head = el('tr');
  ['时间', '原话', '目标', '原因', ''].forEach(t => head.append(el('th', '', t)));
  table.append(head);
  for (const r of rows) {
    const tr = el('tr');
    tr.append(el('td', 'when', routeWhen(r.ts)));
    const said = el('td', 'turn');
    said.append(el('div', '', r.turn_text || '（空）'));
    if (r.needs_confirmation) said.append(el('div', 'need', '需要确认'));
    tr.append(said);
    let target = TARGETS[r.target] || r.target || '';
    if (r.command) target += ' · ' + (COMMANDS[r.command] || r.command);
    tr.append(el('td', '', target), el('td', '', r.reason || r.rule || ''));
    const marks = el('td');
    const yes = el('button', 'mark yes' + (r.verdict === true ? ' on' : ''), '✓');
    yes.title = '这条路由是对的'; yes.setAttribute('aria-label', '标记正确');
    yes.setAttribute('aria-pressed', r.verdict === true ? 'true' : 'false');
    yes.onclick = () => markRoute(r, true);
    const no = el('button', 'mark no' + (r.verdict === false ? ' on' : ''), '✗');
    no.title = '这条路由是错的'; no.setAttribute('aria-label', '标记错误');
    no.setAttribute('aria-pressed', r.verdict === false ? 'true' : 'false');
    no.onclick = () => markRoute(r, false);
    marks.append(yes, no);
    tr.append(marks);
    table.append(tr);
  }
  list.append(table);
}
async function loadLoop() {
  const box = $('loopList');
  if (!box) return;
  let d;
  try { d = await getJSON('/api/loop'); } catch (e) { return; }
  if (d.error) { box.textContent = d.error; return; }
  const rows = d.events || [];
  box.replaceChildren();
  if (!rows.length) {
    box.append(el('div', 'empty', '还没有 task / reply / brief / spoken。'));
    return;
  }
  const table = el('table', 'routes'), head = el('tr');
  ['时间', '类型', '内容'].forEach(t => head.append(el('th', '', t)));
  table.append(head);
  for (const r of rows) {
    const tr = el('tr');
    tr.append(el('td', 'when', routeWhen(r.ts)), el('td', '', r.type || ''), el('td', 'turn', r.summary || ''));
    table.append(tr);
  }
  box.append(table);
}
setInterval(() => loadRoutes(false), 3000);

function showView(name) {
  $('viewT').hidden = name !== 't';
  $('viewE').hidden = name !== 'e';
  $('viewR').hidden = name !== 'r';
  document.querySelector('main').classList.toggle('wide', name === 'e');
  $('tabT').setAttribute('aria-pressed', name === 't');
  $('tabE').setAttribute('aria-pressed', name === 'e');
  $('tabR').setAttribute('aria-pressed', name === 'r');
  if (name === 'e') { loadMatrix(); loadBackends(); pollJob(); }
  if (name === 'r') loadRoutes(true);
}
$('tabT').onclick = () => showView('t');
$('tabE').onclick = () => showView('e');
$('tabR').onclick = () => showView('r');
if (location.hash === '#eval') showView('e');
if (location.hash === '#routes') showView('r');

loadDays().then(() => loadRecords(true));
setInterval(() => loadRecords(false), 3000);
setInterval(loadDays, 60000);
</script>
