[project]
name = "audi27"
version = "0.1.0"
description = "Always-on Mac audio capture -> validated transcripts on disk, searchable by other agents"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "httpx>=0.27",
    "faster-whisper>=1.0",
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
kws = ["sherpa-onnx>=1.10", "pypinyin>=0.51"]

[project.scripts]
audi27 = "audi27.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
