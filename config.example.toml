# Copy to config.toml and edit. Every key is optional; unknown keys are an error.

[audio]
device = ""            # "" = system default input; or a name substring / index from `audi27 devices`
sample_rate = 16000
frame_ms = 30

[segment]
start_margin_db = 10.0   # speech must be this many dB above the tracked noise floor
min_db = -50.0           # absolute floor (dBFS); quieter frames are never speech
start_ms = 150           # consecutive speech needed to open a segment
end_silence_ms = 800     # silence that closes a segment
pre_roll_ms = 300        # audio kept from before the trigger
min_speech_ms = 400      # segments with less voiced audio are dropped before transcription
max_segment_s = 30.0     # hard cut

[transcribe]
backends = ["mlx_whisper"]      # tried in order; later ones are fallbacks, e.g. ["mlx_whisper", "openai"]
languages = ["zh", "en"]        # [] = any language; one = forced; several = auto-detect limited to these
# Style/vocabulary hint (add names, repos). Echoes of it are rejected by validation. "" disables it.
initial_prompt = "以下是普通话和 English 混合的对话。"
max_attempts = 5                # per segment, with backoff; then it moves to data/failed/

[backend.mlx_whisper]           # Apple Silicon GPU; reuses the model already in ~/.cache/huggingface
model = "mlx-community/whisper-turbo"

[backend.faster_whisper]        # CPU; downloads its own ~1.6 GB model on first use
model = "large-v3-turbo"
device = "auto"
compute_type = "int8"
beam_size = 5
vad_filter = true

[backend.openai]                # any OpenAI-compatible /audio/transcriptions endpoint
base_url = "https://api.openai.com/v1"
model = "whisper-1"
api_key_env = "OPENAI_API_KEY"
response_format = "verbose_json"   # verbose_json returns per-segment confidence; "json" does not
timeout_s = 60.0

# A second configuration of the same implementation, under its own name. Used as the reference
# for `audi27 eval`: uv run audi27 eval run gold && uv run audi27 eval compare --ref gold
[backend.gold]                  # xAI Grok Speech to Text; needs XAI_API_KEY in .env
type = "xai"
model = "grok-voice-transcribe-2.0"

# [backend.gpt]                 # OpenAI alternative; needs OPENAI_API_KEY in .env
# type = "openai"
# model = "gpt-transcribe"
# response_format = "json"

[validate]
max_no_speech_prob = 0.6
min_avg_logprob = -1.0
max_compression_ratio = 2.4
min_language_prob = 0.5
max_chars_per_sec = 25.0
extra_hallucination_phrases = []

# Context-aware correction after recognition. See context.md for the context/glossary format.
[correct]
enabled = true
context_file = "context.md"   # plain text, re-read whenever it changes
llm = true                    # false = only the deterministic glossary replacements
backend = "mlx_lm"            # a [corrector.<name>] entry
min_tokens = 4                # shorter texts skip the LLM
recent_lines = 5              # previous lines shown to the LLM
max_change = 0.3              # refuse proposals that change more than this share of the tokens
max_context_chars = 1500

[corrector.mlx_lm]            # in-process, Apple Silicon; uses only models already in ~/.cache/huggingface
model = "mlx-community/Qwen2.5-7B-Instruct-4bit"

# [corrector.server]          # any OpenAI-compatible chat endpoint: LM Studio, Ollama, oMLX, or a cloud API
# type = "openai_chat"
# base_url = "http://127.0.0.1:1234/v1"
# model = "qwen2.5-7b-instruct"
# api_key_env = ""            # e.g. "XAI_API_KEY" with base_url = "https://api.x.ai/v1"

# Group utterances that start with the trigger into one `turn`. Other speech stays ambient.
# `enabled` also starts `audi27 turns run` under `audi27 supervise` / start.sh. Default off.
# Match is only at the start of the text. 大大小小 / 大大方方 are not the wake word.
# Do not put 大大 in context.md: glossary replacement rewrites the whole sentence.
[turns]
enabled = false
triggers = ["达达", "哒哒", "大大", "DaDa", "dada", "Dada"]
gap_s = 2.0             # audio gap (previous end -> next start) that closes a turn; equal still merges
max_duration_s = 120.0  # cap from the first start to the latest end; longer than one 30s segment
wall_close_s = 8.0      # live mode: idle after the last utterance is seen, then close in audio order

# Intent router. Display only: it writes `route` events and never messages an agent.
# Rules are routes.toml if that file exists, otherwise routes.example.toml, re-read every turn.
# `enabled` also starts `audi27 route run` under `audi27 supervise` / start.sh. Default off.
# Turn events have to exist first, so leave [turns] enabled on as well when you turn this on.
[route]
enabled = false
rules = "routes.toml"
llm = false             # true: leftovers go to the [correct] local model; timeout or a bad answer uses default
timeout_s = 8.0

# Execution. Off by default: routes are only displayed until this is turned on.
# `enabled` starts `audi27 dispatch run` from start.sh. Every target uses the
# fake adapter until a real one is configured. Set grok = "grokbot" to POST
# that target to Grok Bot (see [grokbot]). none/queue are never dispatched.
# needs_confirmation writes a task (awaiting_confirmation) and does not call the adapter.
[dispatch]
enabled = false

[dispatch.adapters]
grok = "fake"
muse = "fake"
claude_code = "fake"
local = "fake"

# The fake adapter echoes the route text. A route whose text contains the marker
# fails, or comes back as a reply that needs a decision. delay_s is seconds.
[fake]
delay_s = 0.0
fail_marker = "模拟失败"
decision_marker = "需要你决定"

# Grok Bot webhook. Used only when [dispatch.adapters] grok = "grokbot".
# The URL and the key are NOT config. Put them in .env (gitignored) or the environment:
#   AUDI27_GROKBOT_WEBHOOK_URL=https://...
#   AUDI27_GROKBOT_WEBHOOK_KEY=...
# header_value may contain {key}, which is replaced with that key.
# The default header is `Authorization: Bearer <key>`. If Grok Bot expects a
# different header, change the name and the template here.
[grokbot]
header_name = "Authorization"
header_value = "Bearer {key}"
timeout_s = 10            # seconds for the POST; one retry, and only on a network error
context_utterances = 0    # last N utterances included in the POST; 0 sends none. Max 20.
reply_timeout_s = 1800    # no reply file in this many seconds -> task failed
parse_retries = 3         # JSON parse errors before a reply file is quarantined

# Report queue. `enabled` starts `audi27 queue run` from start.sh.
# The first start does not brief history; a restart replays from that point.
[queue]
enabled = false
summary_chars = 80

# Speaker. `enabled` starts `audi27 speak run` from start.sh.
# voice is passed to macOS `say` (Tingting is zh_CN; older macOS: Ting-Ting).
# Where `say` is missing the line is logged. The first start does not read history.
[speak]
enabled = false
voice = "Tingting"

[store]
data_dir = "data"
# "all" | "suspect" (only suspect+rejected) | "none". Replay/eval and playback need the audio:
# "all" costs ~115 MB per hour of actual speech (16 kHz mono WAV).
keep_audio = "all"
