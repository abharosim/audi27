# Copy to config.toml and edit. Every key is optional; unknown keys are an error.

[audio]
device = ""            # "" = system default input; or a name substring / index from `audi27 devices`
sample_rate = 16000
frame_ms = 30

[segment]
start_margin_db = 10.0   # speech must be this many dB above the tracked noise floor
min_db = -50.0           # absolute floor (dBFS); quieter frames are never speech
start_ms = 150           # consecutive speech needed to open a segment
end_silence_ms = 800     # silence that closes a segment
pre_roll_ms = 300        # audio kept from before the trigger
min_speech_ms = 400      # segments with less voiced audio are dropped before transcription
max_segment_s = 30.0     # hard cut

[transcribe]
backends = ["mlx_whisper"]      # tried in order; later ones are fallbacks, e.g. ["mlx_whisper", "openai"]
languages = ["zh", "en"]        # [] = any language; one = forced; several = auto-detect limited to these
# Style/vocabulary hint (add names, repos). Echoes of it are rejected by validation. "" disables it.
initial_prompt = "以下是普通话和 English 混合的对话。"
max_attempts = 5                # per segment, with backoff; then it moves to data/failed/

[backend.mlx_whisper]           # Apple Silicon GPU; reuses the model already in ~/.cache/huggingface
model = "mlx-community/whisper-turbo"

[backend.faster_whisper]        # CPU; downloads its own ~1.6 GB model on first use
model = "large-v3-turbo"
device = "auto"
compute_type = "int8"
beam_size = 5
vad_filter = true

[backend.openai]                # any OpenAI-compatible /audio/transcriptions endpoint
base_url = "https://api.openai.com/v1"
model = "whisper-1"
api_key_env = "OPENAI_API_KEY"
response_format = "verbose_json"   # verbose_json returns per-segment confidence; "json" does not
timeout_s = 60.0

# A second configuration of the same implementation, under its own name. Used as the reference
# for `audi27 eval`: uv run audi27 eval run gold && uv run audi27 eval compare --ref gold
[backend.gold]                  # xAI Grok Speech to Text; needs XAI_API_KEY in .env
type = "xai"
model = "grok-voice-transcribe-2.0"

# [backend.gpt]                 # OpenAI alternative; needs OPENAI_API_KEY in .env
# type = "openai"
# model = "gpt-transcribe"
# response_format = "json"

[validate]
max_no_speech_prob = 0.6
min_avg_logprob = -1.0
max_compression_ratio = 2.4
min_language_prob = 0.5
max_chars_per_sec = 25.0
extra_hallucination_phrases = []

# Context-aware correction after recognition. See context.md for the context/glossary format.
[correct]
enabled = true
context_file = "context.md"   # plain text, re-read whenever it changes
llm = true                    # false = only the deterministic glossary replacements
backend = "mlx_lm"            # a [corrector.<name>] entry
min_tokens = 4                # shorter texts skip the LLM
recent_lines = 5              # previous lines shown to the LLM
max_change = 0.3              # refuse proposals that change more than this share of the tokens
max_context_chars = 1500

[corrector.mlx_lm]            # in-process, Apple Silicon; uses only models already in ~/.cache/huggingface
model = "mlx-community/Qwen2.5-7B-Instruct-4bit"

# [corrector.server]          # any OpenAI-compatible chat endpoint: LM Studio, Ollama, oMLX, or a cloud API
# type = "openai_chat"
# base_url = "http://127.0.0.1:1234/v1"
# model = "qwen2.5-7b-instruct"
# api_key_env = ""            # e.g. "XAI_API_KEY" with base_url = "https://api.x.ai/v1"

# Group utterances that start with the trigger into one `turn`. Other speech stays ambient.
# `enabled` also starts `audi27 turns run` under `audi27 supervise` / start.sh. Default off.
# Match is only at the start of the text. 大大小小 / 大大方方 are not the wake word.
# Do not put 大大 in context.md: glossary replacement rewrites the whole sentence.
[turns]
enabled = false
triggers = ["达达", "哒哒", "大大", "DaDa", "dada", "Dada"]
gap_s = 2.0             # audio gap (previous end -> next start) that closes a turn; equal still merges
max_duration_s = 120.0  # cap from the first start to the latest end; longer than one 30s segment
wall_close_s = 8.0      # live mode: idle after the last utterance is seen, then close in audio order

# Short local sound as soon as a wake word is heard, before the turn closes
# (does not wait for wall_close_s) and before route or dispatch.
# Default off, same as the other live loops. It watches utterances and plays
# when one would open a turn: status ok/suspect and the text starts with a
# [turns] trigger (your list, including homophones such as 答答). `audi27
# supervise` / start.sh starts `audi27 cue run` when this flag is true. Running
# `audi27 cue run` by hand plays even when the flag is false. `audi27 cue test`
# plays the sound once and writes no event.
# macOS uses `afplay` for at most one second (Tink is already shorter). A missing
# file, a missing `afplay`, or any other OS is logged and does not stop the
# process. A bare yes/no that the mic picks up during that playback, or in the
# short tail after it, is ignored the same way as a TTS read-back.
[cue]
enabled = false
sound = "/System/Library/Sounds/Tink.aiff"

# Streaming wake word on the same microphone frames `audi27 run` already
# captures. Default off. It does not open a second input and it does not wait
# for the VAD segment or for Whisper. A hit plays a tone immediately and
# writes a `wake` event (audio time + keyword) plus `cue_played`, so confirm
# still ignores the ding. A running spotter writes data/kws.live. The text
# cue then skips a trigger only when a wake already sits on that utterance,
# so a homophone the model missed still dings. No live file (model or
# package missing, or the process has stopped) and the text cue keeps working.
# Turns and routes are unchanged: Whisper text still decides the command.
# `audi27 kws download` fetches the model into model_dir (not committed).
# If the package or the model is missing, one ERROR and a kws_status event,
# and the spotter stays off; transcription keeps going. Install with
# `uv sync --extra dev --extra kws`. start.sh adds the kws extra when enabled is true here,
# because `uv sync --extra dev` alone uninstalls it.
# keywords: 达达 / 哒哒 / 大大 / dada become `d á d á @<word>`. A sherpa line
# is also accepted (`d á d á :2 #0.4 @达达`). threshold is the trigger
# probability (higher fires less often). score boosts the keyword in beam
# search. sound empty = 880 Hz, 80 ms sine via sounddevice. debounce_ms is
# the audio-clock gap before another hit can ring.
[kws]
enabled = false
keywords = ["达达", "哒哒", "大大", "DaDa", "dada", "Dada"]
threshold = 0.25
score = 1.5
model_dir = "data/models/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01"
sound = ""
tone_hz = 880
tone_ms = 80
debounce_ms = 1500
heartbeat_s = 60        # INFO counters while the spotter is live; kws.live carries the same stats

# Intent router. Display only: it writes `route` events and never messages an agent.
# Rules are routes.toml if that file exists, otherwise routes.example.toml, re-read every turn.
# `enabled` also starts `audi27 route run` under `audi27 supervise` / start.sh. Default off.
# Turn events have to exist first, so leave [turns] enabled on as well when you turn this on.
[route]
enabled = false
rules = "routes.toml"
llm = false             # true: leftovers go to the [correct] local model; timeout or a bad answer uses default
timeout_s = 8.0

# Execution. Off by default: routes are only displayed until this is turned on.
# `enabled` starts `audi27 dispatch run` from start.sh. Every target uses the
# fake adapter until a real one is configured. Set grok = "grokbot" to POST
# that target to Grok Bot (see [grokbot]). none/queue are never dispatched.
# needs_confirmation writes a task (awaiting_confirmation) and does not call the adapter.
# With [confirm] off that task stays there. With it on, an approve confirm event
# sends it once, reject cancels it, and ttl_s expires it.
[dispatch]
enabled = false

[dispatch.adapters]
grok = "fake"
muse = "fake"
claude_code = "fake"
local = "fake"

# The fake adapter echoes the route text. A route whose text contains the marker
# fails, or comes back as a reply that needs a decision. delay_s is seconds.
[fake]
delay_s = 0.0
fail_marker = "模拟失败"
decision_marker = "需要你决定"

# Grok Bot webhook. Used only when [dispatch.adapters] grok = "grokbot".
# The URL and the key are NOT config. Put them in .env (gitignored) or the environment:
#   AUDI27_GROKBOT_WEBHOOK_URL=https://...
#   AUDI27_GROKBOT_WEBHOOK_KEY=...
# header_value may contain {key}, which is replaced with that key.
# The default header is `Authorization: Bearer <key>`. If Grok Bot expects a
# different header, change the name and the template here.
[grokbot]
header_name = "Authorization"
header_value = "Bearer {key}"
timeout_s = 10            # seconds for the POST; one retry, and only on a network error
context_utterances = 0    # last N utterances included in the POST; 0 sends none. Max 20.
include_screen = false    # also send the front app and window title; stays off so screen text is local
reply_timeout_s = 1800    # no reply file in this many seconds -> task failed
parse_retries = 3         # JSON parse errors before a reply file is quarantined

# Confirmation gate. Off (the default) leaves awaiting_confirmation forever.
# On: the queue reads the action back and asks 确认还是取消？ A following 达达
# turn, a bare answer within window_s of that read-back, or a dashboard button
# writes a confirm event. The dispatcher sends the original route only after
# approve. ttl_s later the task is expired and is never sent.
# `enabled` starts `audi27 confirm run` from start.sh.
[confirm]
enabled = false
ttl_s = 600
window_s = 20

# Report queue. `enabled` starts `audi27 queue run` from start.sh.
# The first start does not brief history; a restart replays from that point.
[queue]
enabled = false
summary_chars = 80

# Speaker. `enabled` starts `audi27 speak run` from start.sh.
# voice is passed to macOS `say` (Tingting is zh_CN; older macOS: Ting-Ting).
# Where `say` is missing the line is logged. The first start does not read history.
[speak]
enabled = false
voice = "Tingting"

# Fast "is the user talking" signal. Default off: the speaker keeps using the
# status.json heartbeat (about 0.4 s). On: the recorder writes data/presence.json
# from the energy VAD it already runs, and appends a presence event only when
# the debounced state changes. The speaker will not start during speech or for
# grace_s after it ends, and kills `say` when speech starts. A stale or
# future-dated file does not block. No extra process; start.sh wires nothing
# unless this flag is on.
[presence]
enabled = false
publish_s = 0.1       # refresh the file at least this often; also on every change. <= 0.2
stale_s = 1.0         # older than this (or timestamped ahead of now) is unknown
onset_ms = 60         # continuous speech before "speaking" (max 200, so the file is in time)
hangover_ms = 400     # continuous silence before "quiet"; shorter gaps do not flap
grace_s = 0.3         # after quiet, wait this long before the speaker starts

# Frontmost app and window title only. Default off: nothing is sampled and turns
# are unchanged. On macOS, `audi27 screen run` (and start.sh, when this is on)
# polls the front app. The window title needs Accessibility permission; without
# it the app name is still recorded. Other systems log once and write nothing.
# No screenshots, no OCR, no window contents.
# A snapshot is written only when the app or title changes, after it has held
# for debounce_s. Excluded apps keep the app name and drop the title. Add bank
# apps to exclude_apps. A private-window marker or a redact pattern drops the
# whole title. Titles are cut to max_title_chars.
# Turns and routes pick up the latest snapshot at the turn's end. While
# `audi27 screen run` is alive it rewrites data/screen.json (timestamps only).
# That heartbeat means a change-only event older than stale_s is still the
# front window. If the heartbeat shows the sampler had stopped, or this
# process started after the turn, nothing is attached. With no heartbeat file,
# stale_s is the age limit. Sent to Grok Bot only when [grokbot] include_screen
# is true. An excluded title is dropped again at attach time and before the POST.
[screen]
enabled = false
poll_s = 2.0
debounce_s = 1.0
stale_s = 3600
max_title_chars = 200
exclude_apps = [
    "1Password",
    "com.1password.1password",
    "com.agilebits.onepassword7",
    "com.agilebits.onepassword",
    "Bitwarden",
    "com.bitwarden.desktop",
    "Keychain Access",
    "钥匙串访问",
    "com.apple.keychainaccess",
]
redact_title_patterns = []
private_title_markers = ["incognito", "inprivate", "private browsing", "private window", "无痕", "隐私浏览"]

[store]
data_dir = "data"
# "all" | "suspect" (only suspect+rejected) | "none". Replay/eval and playback need the audio:
# "all" costs ~115 MB per hour of actual speech (16 kHz mono WAV).
keep_audio = "all"
