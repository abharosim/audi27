name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # mlx / mlx-whisper are macOS-only and skipped by the environment marker.
      # The suite does not load a model or open a microphone.
      - run: uv sync --extra dev --frozen
      - run: uv run pytest
